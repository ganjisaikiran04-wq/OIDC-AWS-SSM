
name: Terraform Build and Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. GITHUB OIDC -> AWS
      # =====================================================

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::250368537874:role/oidc
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: 250368537874
          output-env-credentials: true
          unset-current-credentials: true


      # =====================================================
      # 3. VERIFY AWS
      # =====================================================

      - name: Verify AWS identity
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "AWS IDENTITY"
          echo "=============================================="

          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"

          echo ""
          echo "AWS CLI:"
          aws --version

          echo ""
          echo "AWS Identity:"
          aws sts get-caller-identity

          echo ""
          echo "AWS Region:"
          echo "$AWS_REGION"

          echo "=============================================="


      # =====================================================
      # 4. SETUP TERRAFORM
      # =====================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # =====================================================
      # 5. TERRAFORM FORMAT
      # =====================================================

      - name: Terraform Format
        shell: bash
        run: |
          set -e

          terraform fmt -recursive


      # =====================================================
      # 6. TERRAFORM INIT
      # =====================================================

      - name: Terraform Init
        shell: bash
        run: |
          set -e

          terraform init


      # =====================================================
      # 7. TERRAFORM VALIDATE
      # =====================================================

      - name: Terraform Validate
        shell: bash
        run: |
          set -e

          terraform validate


      # =====================================================
      # 8. TERRAFORM PLAN
      # =====================================================

      - name: Terraform Plan
        shell: bash
        run: |
          set -e

          terraform plan \
            -var="aws_region=${AWS_REGION}" \
            -var="ami_id=${{ secrets.AMI_ID }}" \
            -var="key_name=aps" \
            -var="instance_type=t3.micro"


      # =====================================================
      # 9. TERRAFORM APPLY
      # =====================================================

      - name: Terraform Apply
        shell: bash
        run: |
          set -e

          terraform apply \
            -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="ami_id=${{ secrets.AMI_ID }}" \
            -var="key_name=aps" \
            -var="instance_type=t3.micro"


      # =====================================================
      # 10. SHOW TERRAFORM OUTPUTS
      # =====================================================

      - name: Show Terraform outputs
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "TERRAFORM OUTPUTS"
          echo "=============================================="

          terraform output

          echo "=============================================="


      # =====================================================
      # 11. GET TERRAFORM OUTPUTS
      # =====================================================

      - name: Get Terraform outputs
        id: terraform
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "GETTING TERRAFORM OUTPUTS"
          echo "=============================================="

          PRIVATE_INSTANCE_ID=$(terraform output -raw private_instance_id)
          PRIVATE_IP=$(terraform output -raw private_ec2_ip)
          ALB_DNS=$(terraform output -raw alb_dns_name)
          APPLICATION_URL=$(terraform output -raw application_url)

          echo "private_instance_id=$PRIVATE_INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "private_ip=$PRIVATE_IP" >> "$GITHUB_OUTPUT"
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"
          echo "application_url=$APPLICATION_URL" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Private EC2 Instance ID:"
          echo "$PRIVATE_INSTANCE_ID"

          echo ""
          echo "Private EC2 IP:"
          echo "$PRIVATE_IP"

          echo ""
          echo "ALB DNS:"
          echo "$ALB_DNS"

          echo ""
          echo "Application URL:"
          echo "$APPLICATION_URL"

          echo ""
          echo "Terraform outputs retrieved successfully."

          echo "=============================================="


      # =====================================================
      # 12. DISPLAY INFRASTRUCTURE
      # =====================================================

      - name: Display infrastructure
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "INFRASTRUCTURE"
          echo "=============================================="

          echo "Private EC2 Instance ID:"
          echo "${{ steps.terraform.outputs.private_instance_id }}"

          echo ""

          echo "Private EC2 IP:"
          echo "${{ steps.terraform.outputs.private_ip }}"

          echo ""

          echo "ALB DNS:"
          echo "${{ steps.terraform.outputs.alb_dns }}"

          echo ""

          echo "Application URL:"
          echo "${{ steps.terraform.outputs.application_url }}"

          echo "=============================================="


      # =====================================================
      # 13. WAIT FOR SSM AGENT
      # =====================================================

      - name: Wait for SSM agent
        shell: bash
        run: |
          set -e

          INSTANCE_ID="${{ steps.terraform.outputs.private_instance_id }}"

          echo "=============================================="
          echo "WAITING FOR SSM AGENT"
          echo "Instance: $INSTANCE_ID"
          echo "=============================================="

          for i in {1..30}; do

            STATUS=$(aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || true)

            echo "Attempt $i/30 - SSM status: $STATUS"

            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent is ONLINE"
              exit 0
            fi

            sleep 10

          done

          echo "SSM agent did not become online"
          exit 1


      # =====================================================
      # 14. TEST SSM CONNECTION
      # =====================================================

      - name: Test SSM connection
        shell: bash
        run: |
          set -e

          INSTANCE_ID="${{ steps.terraform.outputs.private_instance_id }}"

          echo "=============================================="
          echo "TESTING SSM CONNECTION"
          echo "Instance: $INSTANCE_ID"
          echo "=============================================="

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["hostname","python3 --version || true","curl --version || true"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Command status: $STATUS"

            if [ "$STATUS" = "Success" ]; then

              echo ""
              echo "SSM command output:"

              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text

              exit 0

            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "SSM command failed."

              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID"

              exit 1

            fi

            sleep 5

          done

          echo "SSM command timeout"
          exit 1


      # =====================================================
      # 15. PREPARE APPLICATION FILES
      # =====================================================

      - name: Prepare application files
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "ENCODING APPLICATION FILES"
          echo "=============================================="

          if [ ! -f app.py ]; then
            echo "ERROR: app.py not found"
            exit 1
          fi

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          APP_B64=$(base64 -w 0 app.py)
          REQ_B64=$(base64 -w 0 requirements.txt)

          echo "APP_B64=$APP_B64" >> "$GITHUB_ENV"
          echo "REQ_B64=$REQ_B64" >> "$GITHUB_ENV"

          echo "Application files encoded successfully."


      # =====================================================
      # 16. DEPLOY APPLICATION THROUGH SSM
      # =====================================================

      - name: Deploy application through SSM
        shell: bash
        run: |
          set -e

          INSTANCE_ID="${{ steps.terraform.outputs.private_instance_id }}"

          echo "=============================================="
          echo "DEPLOYING APPLICATION THROUGH SSM"
          echo "=============================================="

          echo "Instance:"
          echo "$INSTANCE_ID"

          DEPLOY_COMMAND=$(cat <<EOF
          #!/bin/bash

          set -e

          echo "=========================================="
          echo "APPLICATION DEPLOYMENT STARTED"
          echo "=========================================="

          echo ""
          echo "=========================================="
          echo "DETECTING OPERATING SYSTEM"
          echo "=========================================="

          if command -v dnf >/dev/null 2>&1; then

              echo "Amazon Linux / DNF detected"

              # IMPORTANT:
              # Amazon Linux 2023 normally uses curl-minimal.
              # Do NOT install the full curl package because
              # it conflicts with curl-minimal.

              dnf install -y \
                python3 \
                python3-pip \
                python3-devel \
                nginx

              # Verify curl is available.
              # curl-minimal is normally already installed.
              if ! command -v curl >/dev/null 2>&1; then
                  echo "curl is not installed. Installing curl-minimal..."
                  dnf install -y curl-minimal
              fi

          elif command -v yum >/dev/null 2>&1; then

              echo "YUM detected"

              yum install -y \
                python3 \
                python3-pip \
                python3-devel \
                nginx \
                curl

          elif command -v apt-get >/dev/null 2>&1; then

              echo "Debian / Ubuntu detected"

              export DEBIAN_FRONTEND=noninteractive

              apt-get update -y

              apt-get install -y \
                python3 \
                python3-pip \
                python3-venv \
                python3-dev \
                nginx \
                curl

          else

              echo "Unsupported operating system"
              exit 1

          fi


          echo ""
          echo "=========================================="
          echo "VERIFYING PACKAGES"
          echo "=========================================="

          echo "Python:"
          python3 --version

          echo ""
          echo "Pip:"
          pip3 --version

          echo ""
          echo "Nginx:"
          nginx -v

          echo ""
          echo "Curl:"
          curl --version | head -n 1


          # -------------------------------------------------
          # Application directory
          # -------------------------------------------------

          echo ""
          echo "=========================================="
          echo "CREATING APPLICATION DIRECTORY"
          echo "=========================================="

          mkdir -p /opt/multicloud-devops

          if id ec2-user >/dev/null 2>&1; then
              chown -R ec2-user:ec2-user /opt/multicloud-devops
          fi


          # -------------------------------------------------
          # Write app.py
          # -------------------------------------------------

          echo ""
          echo "Writing app.py..."

          echo "$APP_B64" | base64 -d \
            > /opt/multicloud-devops/app.py


          # -------------------------------------------------
          # Write requirements.txt
          # -------------------------------------------------

          echo "Writing requirements.txt..."

          echo "$REQ_B64" | base64 -d \
            > /opt/multicloud-devops/requirements.txt


          if id ec2-user >/dev/null 2>&1; then

              chown ec2-user:ec2-user \
                /opt/multicloud-devops/app.py

              chown ec2-user:ec2-user \
                /opt/multicloud-devops/requirements.txt

          fi


          # -------------------------------------------------
          # Verify application files
          # -------------------------------------------------

          echo ""
          echo "=========================================="
          echo "APPLICATION FILES"
          echo "=========================================="

          ls -lah /opt/multicloud-devops

          echo ""
          echo "requirements.txt:"
          cat /opt/multicloud-devops/requirements.txt


          # -------------------------------------------------
          # Python virtual environment
          # -------------------------------------------------

          echo ""
          echo "=========================================="
          echo "CREATING PYTHON VIRTUAL ENVIRONMENT"
          echo "=========================================="

          cd /opt/multicloud-devops

          if [ ! -d "venv" ]; then

              python3 -m venv venv

          fi


          ./venv/bin/python \
            -m pip install --upgrade pip


          # -------------------------------------------------
          # Install Flask/Gunicorn requirements
          # -------------------------------------------------

          echo ""
          echo "=========================================="
          echo "INSTALLING PYTHON REQUIREMENTS"
          echo "=========================================="

          ./venv/bin/pip \
            install -r requirements.txt


          # -------------------------------------------------
          # Verify Gunicorn
          # -------------------------------------------------

          echo ""
          echo "=========================================="
          echo "VERIFYING GUNICORN"
          echo "=========================================="

          ./venv/bin/gunicorn \
            --version


          # -------------------------------------------------
          # Verify Flask application
          # -------------------------------------------------

          echo ""
          echo "=========================================="
          echo "VERIFYING FLASK APPLICATION"
          echo "=========================================="

          ./venv/bin/python \
            -c "import app; print('Flask application imported successfully')"


          # -------------------------------------------------
          # Create systemd service
          # -------------------------------------------------

          echo ""
          echo "=========================================="
          echo "CREATING SYSTEMD SERVICE"
          echo "=========================================="

          cat > /etc/systemd/system/multicloud-devops.service <<'SERVICE'

          [Unit]
          Description=Multi Cloud DevOps Flask Application
          After=network.target

          [Service]
          Type=simple

          User=ec2-user
          Group=ec2-user

          WorkingDirectory=/opt/multicloud-devops

          Environment="PYTHONUNBUFFERED=1"
          Environment="PATH=/opt/multicloud-devops/venv/bin"

          ExecStart=/opt/multicloud-devops/venv/bin/gunicorn --workers 2 --bind 0.0.0.0:5000 app:app

          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

          SERVICE


          # -------------------------------------------------
          # Start Flask/Gunicorn
          # -------------------------------------------------

          echo ""
          echo "=========================================="
          echo "STARTING GUNICORN"
          echo "=========================================="

          systemctl daemon-reload

          systemctl enable multicloud-devops

          systemctl restart multicloud-devops

          sleep 5


          echo ""
          echo "=========================================="
          echo "FLASK/GUNICORN STATUS"
          echo "=========================================="

          if ! systemctl is-active --quiet multicloud-devops; then

              echo "Gunicorn service failed to start."

              systemctl status \
                multicloud-devops \
                --no-pager \
                -l || true

              echo ""
              echo "Recent journal logs:"

              journalctl \
                -u multicloud-devops \
                -n 100 \
                --no-pager || true

              exit 1

          fi

          systemctl status \
            multicloud-devops \
            --no-pager \
            -l


          # -------------------------------------------------
          # Test Flask
          # -------------------------------------------------

          echo ""
          echo "=========================================="
          echo "TESTING FLASK ON PORT 5000"
          echo "=========================================="

          curl -f \
            --connect-timeout 10 \
            --max-time 30 \
            http://127.0.0.1:5000/


          # -------------------------------------------------
          # Configure Nginx
          # -------------------------------------------------

          echo ""
          echo "=========================================="
          echo "CONFIGURING NGINX"
          echo "=========================================="

          cat > /etc/nginx/conf.d/multicloud-devops.conf <<'NGINX'

          server {

              listen 80;

              server_name _;

              location / {

                  proxy_pass http://127.0.0.1:5000;

                  proxy_http_version 1.1;

                  proxy_set_header Host \$host;

                  proxy_set_header X-Real-IP \$remote_addr;

                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;

                  proxy_set_header X-Forwarded-Proto \$scheme;

              }

          }

          NGINX


          # -------------------------------------------------
          # Remove default Nginx config
          # -------------------------------------------------

          rm -f /etc/nginx/conf.d/default.conf


          # -------------------------------------------------
          # Test Nginx
          # -------------------------------------------------

          echo ""
          echo "=========================================="
          echo "TESTING NGINX CONFIGURATION"
          echo "=========================================="

          nginx -t


          # -------------------------------------------------
          # Start Nginx
          # -------------------------------------------------

          echo ""
          echo "=========================================="
          echo "STARTING NGINX"
          echo "=========================================="

          systemctl enable nginx

          systemctl restart nginx

          sleep 3


          echo ""
          echo "=========================================="
          echo "NGINX STATUS"
          echo "=========================================="

          if ! systemctl is-active --quiet nginx; then

              echo "Nginx failed to start."

              systemctl status \
                nginx \
                --no-pager \
                -l || true

              journalctl \
                -u nginx \
                -n 100 \
                --no-pager || true

              exit 1

          fi

          systemctl status \
            nginx \
            --no-pager \
            -l


          # -------------------------------------------------
          # Test Nginx
          # -------------------------------------------------

          echo ""
          echo "=========================================="
          echo "TESTING NGINX ON PORT 80"
          echo "=========================================="

          curl -f \
            --connect-timeout 10 \
            --max-time 30 \
            http://127.0.0.1/


          echo ""
          echo "=========================================="
          echo "APPLICATION DEPLOYED SUCCESSFULLY"
          echo "=========================================="

          EOF
          )


          # =================================================
          # SEND COMMAND USING SSM
          # =================================================

          echo ""
          echo "Sending deployment command to SSM..."

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$(jq -n \
              --arg command "$DEPLOY_COMMAND" \
              '{commands:[$command]}')" \
            --comment "Deploy Multi Cloud DevOps Flask application" \
            --timeout-seconds 3600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID:"
          echo "$COMMAND_ID"


          # =================================================
          # WAIT FOR DEPLOYMENT
          # =================================================

          echo ""
          echo "Waiting for deployment..."

          for i in {1..120}; do

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment attempt $i/120 - status: $STATUS"

            if [ "$STATUS" = "Success" ]; then

              echo ""
              echo "=========================================="
              echo "SSM DEPLOYMENT SUCCESS"
              echo "=========================================="

              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text

              exit 0

            fi


            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo ""
              echo "=========================================="
              echo "SSM DEPLOYMENT FAILED"
              echo "=========================================="

              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID"

              exit 1

            fi

            sleep 5

          done

          echo "Deployment timed out"

          exit 1


      # =====================================================
      # 17. CHECK ALB TARGET HEALTH
      # =====================================================

      - name: Check ALB target health
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "CHECKING ALB TARGET HEALTH"
          echo "=============================================="

          TARGET_ARN=$(aws elbv2 describe-target-groups \
            --region "$AWS_REGION" \
            --names multicloud-devops-tg \
            --query "TargetGroups[0].TargetGroupArn" \
            --output text)

          echo "Target Group:"
          echo "$TARGET_ARN"

          echo ""

          for i in {1..30}; do

            echo "Health check attempt $i/30"

            HEALTH=$(aws elbv2 describe-target-health \
              --region "$AWS_REGION" \
              --target-group-arn "$TARGET_ARN" \
              --query "TargetHealthDescriptions[0].TargetHealth.State" \
              --output text 2>/dev/null || true)

            echo "Target health: $HEALTH"

            if [ "$HEALTH" = "healthy" ]; then

              echo ""
              echo "ALB target is HEALTHY"
              exit 0

            fi

            sleep 10

          done

          echo ""
          echo "ALB target did not become healthy."

          aws elbv2 describe-target-health \
            --region "$AWS_REGION" \
            --target-group-arn "$TARGET_ARN"

          exit 1


      # =====================================================
      # 18. TEST APPLICATION THROUGH ALB
      # =====================================================

      - name: Test application through ALB
        shell: bash
        run: |
          set -e

          URL="${{ steps.terraform.outputs.application_url }}"

          echo "=========================================="
          echo "APPLICATION URL"
          echo "=========================================="

          echo "$URL"

          echo ""
          echo "Testing application through ALB..."

          for i in {1..20}; do

            echo ""
            echo "Application test $i/20"

            if curl \
              -f \
              --connect-timeout 10 \
              --max-time 30 \
              "$URL"; then

              echo ""
              echo "=========================================="
              echo "APPLICATION IS LIVE"
              echo "=========================================="

              exit 0

            fi

            echo "Application not ready yet..."

            sleep 10

          done

          echo ""
          echo "=========================================="
          echo "ALB APPLICATION TEST FAILED"
          echo "=========================================="

          exit 1


      # =====================================================
      # 19. FINAL OUTPUT
      # =====================================================

      - name: Deployment successful
        shell: bash
        run: |
          set -e

          echo ""
          echo "================================================"
          echo "        DEPLOYMENT SUCCESSFUL"
          echo "================================================"

          echo ""

          echo "AWS Region:"
          echo "${AWS_REGION}"

          echo ""

          echo "Private EC2:"
          echo "${{ steps.terraform.outputs.private_ip }}"

          echo ""

          echo "SSM Instance ID:"
          echo "${{ steps.terraform.outputs.private_instance_id }}"

          echo ""

          echo "ALB:"
          echo "${{ steps.terraform.outputs.alb_dns }}"

          echo ""

          echo "Application:"
          echo "${{ steps.terraform.outputs.application_url }}"

          echo ""

          echo "Architecture:"
          echo "GitHub OIDC -> AWS IAM -> Terraform -> SSM -> Private EC2"

          echo "User -> ALB -> Nginx -> Gunicorn -> Flask"

          echo ""

          echo "================================================"

