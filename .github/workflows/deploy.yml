name: Terraform Build and Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_DEFAULT_REGION: ap-southeast-1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. GITHUB OIDC -> AWS
      # =====================================================

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::250368537874:role/oidc
          aws-region: ap-southeast-1
          allowed-account-ids: 250368537874
          output-env-credentials: true
          unset-current-credentials: true


      # =====================================================
      # 3. VERIFY AWS
      # =====================================================

      - name: Verify AWS identity
        run: |
          echo "=============================================="
          echo "AWS IDENTITY"
          echo "=============================================="

          echo "AWS_REGION=${AWS_REGION}"
          echo "AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}"

          echo ""
          echo "AWS CLI:"
          aws --version

          echo ""
          echo "AWS Identity:"
          aws sts get-caller-identity

          echo ""
          echo "AWS Region:"
          echo "${AWS_REGION}"

          echo "=============================================="


      # =====================================================
      # 4. SETUP TERRAFORM
      # =====================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3


      # =====================================================
      # 5. TERRAFORM FORMAT
      # =====================================================

      - name: Terraform Format
        run: |
          terraform fmt -recursive


      # =====================================================
      # 6. TERRAFORM INIT
      # =====================================================

      - name: Terraform Init
        run: |
          terraform init


      # =====================================================
      # 7. TERRAFORM VALIDATE
      # =====================================================

      - name: Terraform Validate
        run: |
          terraform validate


      # =====================================================
      # 8. TERRAFORM PLAN
      # =====================================================

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="aws_region=${AWS_REGION}" \
            -var="ami_id=${{ secrets.AMI_ID }}" \
            -var="key_name=aps" \
            -var="instance_type=t3.micro"


      # =====================================================
      # 9. TERRAFORM APPLY
      # =====================================================

      - name: Terraform Apply
        run: |
          terraform apply \
            -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="ami_id=${{ secrets.AMI_ID }}" \
            -var="key_name=aps" \
            -var="instance_type=t3.micro"


      # =====================================================
      # 10. GET TERRAFORM OUTPUTS
      # =====================================================

      - name: Get Terraform outputs
        id: terraform
        shell: bash
        run: |
          set -e

          echo "Getting Terraform outputs..."

          PRIVATE_INSTANCE_ID=$(terraform output -raw private_instance_id)
          PRIVATE_IP=$(terraform output -raw private_ec2_ip)
          ALB_DNS=$(terraform output -raw alb_dns_name)
          APPLICATION_URL=$(terraform output -raw application_url)
          BASTION_IP=$(terraform output -raw bastion_public_ip)

          echo "private_instance_id=$PRIVATE_INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "private_ip=$PRIVATE_IP" >> "$GITHUB_OUTPUT"
          echo "alb_dns=$ALB_DNS" >> "$GITHUB_OUTPUT"
          echo "application_url=$APPLICATION_URL" >> "$GITHUB_OUTPUT"
          echo "bastion_ip=$BASTION_IP" >> "$GITHUB_OUTPUT"


      # =====================================================
      # 11. DISPLAY INFRASTRUCTURE
      # =====================================================

      - name: Display infrastructure
        run: |
          echo "=============================================="
          echo "Infrastructure"
          echo "=============================================="

          echo "Private EC2 Instance ID:"
          echo "${{ steps.terraform.outputs.private_instance_id }}"

          echo ""

          echo "Private EC2 IP:"
          echo "${{ steps.terraform.outputs.private_ip }}"

          echo ""

          echo "Bastion IP:"
          echo "${{ steps.terraform.outputs.bastion_ip }}"

          echo ""

          echo "ALB DNS:"
          echo "${{ steps.terraform.outputs.alb_dns }}"

          echo ""

          echo "Application URL:"
          echo "${{ steps.terraform.outputs.application_url }}"

          echo "=============================================="


      # =====================================================
      # 12. WAIT FOR SSM AGENT
      # =====================================================

      - name: Wait for SSM agent
        shell: bash
        run: |
          set -e

          INSTANCE_ID="${{ steps.terraform.outputs.private_instance_id }}"

          echo "=============================================="
          echo "WAITING FOR SSM AGENT"
          echo "=============================================="

          echo "Instance ID: $INSTANCE_ID"

          for i in {1..30}; do

            STATUS=$(aws ssm describe-instance-information \
              --region "$AWS_REGION" \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || true)

            echo "Attempt $i/30 - SSM status: $STATUS"

            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent is ONLINE"
              exit 0
            fi

            sleep 10

          done

          echo "SSM agent did not become online"
          exit 1


      # =====================================================
      # 13. TEST SSM CONNECTION
      # =====================================================

      - name: Test SSM connection
        shell: bash
        run: |
          set -e

          INSTANCE_ID="${{ steps.terraform.outputs.private_instance_id }}"

          echo "=============================================="
          echo "TESTING SSM CONNECTION"
          echo "=============================================="

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["hostname","python3 --version || true"]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Attempt $i/30 - Command status: $STATUS"

            if [ "$STATUS" = "Success" ]; then

              echo ""
              echo "SSM command successful"
              echo ""

              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text

              exit 0

            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "SSM command failed"

              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID"

              exit 1

            fi

            sleep 5

          done

          echo "SSM command timeout"
          exit 1


      # =====================================================
      # 14. PREPARE APPLICATION FILES
      # =====================================================

      - name: Prepare application files
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo "PREPARING APPLICATION"
          echo "=============================================="

          if [ ! -f "app.py" ]; then
            echo "ERROR: app.py not found"
            exit 1
          fi

          if [ ! -f "requirements.txt" ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          echo "Encoding application..."

          APP_B64=$(base64 -w 0 app.py)
          REQ_B64=$(base64 -w 0 requirements.txt)

          {
            echo "APP_B64=$APP_B64"
            echo "REQ_B64=$REQ_B64"
          } >> "$GITHUB_ENV"

          echo "Application files prepared successfully"


      # =====================================================
      # 15. DEPLOY APPLICATION THROUGH SSM
      # =====================================================

      - name: Deploy application through SSM
        shell: bash
        run: |
          set -e

          INSTANCE_ID="${{ steps.terraform.outputs.private_instance_id }}"

          echo "=============================================="
          echo "DEPLOY APPLICATION THROUGH SSM"
          echo "=============================================="

          echo "Deploying application to:"
          echo "$INSTANCE_ID"

          DEPLOY_COMMAND=$(cat <<EOF
          set -e

          echo "=========================================="
          echo "Installing application dependencies"
          echo "=========================================="

          # -------------------------------------------------
          # Detect operating system
          # -------------------------------------------------

          if command -v dnf >/dev/null 2>&1; then

              echo "Amazon Linux / DNF detected"

              dnf install -y \
                python3 \
                python3-pip \
                python3-devel \
                nginx \
                curl

          elif command -v yum >/dev/null 2>&1; then

              echo "YUM detected"

              yum install -y \
                python3 \
                python3-pip \
                python3-devel \
                nginx \
                curl

          elif command -v apt-get >/dev/null 2>&1; then

              echo "Debian / Ubuntu detected"

              export DEBIAN_FRONTEND=noninteractive

              apt-get update -y

              apt-get install -y \
                python3 \
                python3-pip \
                python3-venv \
                python3-dev \
                nginx \
                curl

          else

              echo "Unsupported operating system"
              exit 1

          fi


          echo "=========================================="
          echo "VERSIONS"
          echo "=========================================="

          echo "Python:"
          python3 --version

          echo "Pip:"
          pip3 --version

          echo "Nginx:"
          nginx -v


          # -------------------------------------------------
          # Application directory
          # -------------------------------------------------

          echo "=========================================="
          echo "APPLICATION DIRECTORY"
          echo "=========================================="

          mkdir -p /opt/multicloud-devops

          if id ec2-user >/dev/null 2>&1; then
              chown -R ec2-user:ec2-user /opt/multicloud-devops
          fi


          # -------------------------------------------------
          # Write app.py
          # -------------------------------------------------

          echo "Writing app.py..."

          echo "$APP_B64" | base64 -d \
            > /opt/multicloud-devops/app.py


          # -------------------------------------------------
          # Write requirements.txt
          # -------------------------------------------------

          echo "Writing requirements.txt..."

          echo "$REQ_B64" | base64 -d \
            > /opt/multicloud-devops/requirements.txt


          if id ec2-user >/dev/null 2>&1; then

              chown ec2-user:ec2-user \
                /opt/multicloud-devops/app.py

              chown ec2-user:ec2-user \
                /opt/multicloud-devops/requirements.txt

          fi


          # -------------------------------------------------
          # Python virtual environment
          # -------------------------------------------------

          echo "=========================================="
          echo "PYTHON VIRTUAL ENVIRONMENT"
          echo "=========================================="

          cd /opt/multicloud-devops

          if [ ! -d "venv" ]; then

              python3 -m venv venv

          fi


          ./venv/bin/python \
            -m pip install --upgrade pip


          # -------------------------------------------------
          # Install Flask/Gunicorn requirements
          # -------------------------------------------------

          echo "Installing application requirements..."

          ./venv/bin/pip \
            install -r requirements.txt


          # -------------------------------------------------
          # Verify Gunicorn
          # -------------------------------------------------

          echo "=========================================="
          echo "GUNICORN"
          echo "=========================================="

          ./venv/bin/gunicorn \
            --version


          # -------------------------------------------------
          # Create systemd service
          # -------------------------------------------------

          echo "Creating systemd service..."

          cat > /etc/systemd/system/multicloud-devops.service <<'SERVICE'

          [Unit]
          Description=Multi Cloud DevOps Flask Application
          After=network.target

          [Service]
          User=ec2-user
          Group=ec2-user

          WorkingDirectory=/opt/multicloud-devops

          Environment="PYTHONUNBUFFERED=1"
          Environment="PATH=/opt/multicloud-devops/venv/bin"

          ExecStart=/opt/multicloud-devops/venv/bin/gunicorn --workers 2 --bind 0.0.0.0:5000 app:app

          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

          SERVICE


          # -------------------------------------------------
          # Start Flask/Gunicorn
          # -------------------------------------------------

          echo "Starting Flask/Gunicorn..."

          systemctl daemon-reload

          systemctl enable multicloud-devops

          systemctl restart multicloud-devops

          sleep 5


          echo "=========================================="
          echo "FLASK/GUNICORN STATUS"
          echo "=========================================="

          systemctl status \
            multicloud-devops \
            --no-pager \
            -l


          # -------------------------------------------------
          # Test Flask
          # -------------------------------------------------

          echo "=========================================="
          echo "TESTING FLASK"
          echo "=========================================="

          curl -f \
            http://127.0.0.1:5000/


          # -------------------------------------------------
          # Configure Nginx
          # -------------------------------------------------

          echo "=========================================="
          echo "CONFIGURING NGINX"
          echo "=========================================="

          cat > /etc/nginx/conf.d/multicloud-devops.conf <<'NGINX'

          server {
              listen 80;

              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:5000;

                  proxy_http_version 1.1;

                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }

          NGINX


          # -------------------------------------------------
          # Remove default Nginx config
          # -------------------------------------------------

          rm -f /etc/nginx/conf.d/default.conf


          # -------------------------------------------------
          # Test Nginx
          # -------------------------------------------------

          echo "Testing Nginx configuration..."

          nginx -t


          # -------------------------------------------------
          # Start Nginx
          # -------------------------------------------------

          echo "Starting Nginx..."

          systemctl enable nginx

          systemctl restart nginx

          sleep 3


          echo "=========================================="
          echo "NGINX STATUS"
          echo "=========================================="

          systemctl status \
            nginx \
            --no-pager \
            -l


          # -------------------------------------------------
          # Test Nginx
          # -------------------------------------------------

          echo "=========================================="
          echo "TESTING NGINX"
          echo "=========================================="

          curl -f \
            http://127.0.0.1/


          echo ""
          echo "=========================================="
          echo "APPLICATION DEPLOYED SUCCESSFULLY"
          echo "=========================================="

          EOF
          )


          # =================================================
          # SEND COMMAND USING SSM
          # =================================================

          echo "Sending deployment command through SSM..."

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$(jq -n \
              --arg command "$DEPLOY_COMMAND" \
              '{commands:[$command]}')" \
            --comment "Deploy Multi Cloud DevOps Flask application" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID:"
          echo "$COMMAND_ID"


          # =================================================
          # WAIT FOR DEPLOYMENT
          # =================================================

          echo "Waiting for deployment..."

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Attempt $i/60 - Deployment status: $STATUS"


            if [ "$STATUS" = "Success" ]; then

              echo ""
              echo "=========================================="
              echo "SSM DEPLOYMENT SUCCESS"
              echo "=========================================="

              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text

              exit 0

            fi


            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo ""
              echo "=========================================="
              echo "SSM DEPLOYMENT FAILED"
              echo "=========================================="

              aws ssm get-command-invocation \
                --region "$AWS_REGION" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID"

              exit 1

            fi

            sleep 5

          done


          echo "Deployment timed out"

          exit 1


      # =====================================================
      # 16. CHECK ALB TARGET
      # =====================================================

      - name: Check ALB target health
        shell: bash
        run: |

          echo "=============================================="
          echo "ALB TARGET HEALTH"
          echo "=============================================="

          echo "Waiting for ALB target health..."

          sleep 20


          TARGET_ARN=$(aws elbv2 describe-target-groups \
            --region "$AWS_REGION" \
            --names multicloud-devops-tg \
            --query "TargetGroups[0].TargetGroupArn" \
            --output text)


          echo "Target Group:"
          echo "$TARGET_ARN"


          aws elbv2 describe-target-health \
            --region "$AWS_REGION" \
            --target-group-arn "$TARGET_ARN"


      # =====================================================
      # 17. TEST APPLICATION THROUGH ALB
      # =====================================================

      - name: Test application through ALB
        shell: bash
        run: |

          set -e

          URL="${{ steps.terraform.outputs.application_url }}"

          echo "=========================================="
          echo "APPLICATION URL"
          echo "=========================================="

          echo "$URL"

          echo ""
          echo "Testing application..."


          for i in {1..10}; do

            if curl -f \
              --connect-timeout 10 \
              --max-time 30 \
              "$URL"; then

              echo ""
              echo "=========================================="
              echo "APPLICATION IS LIVE"
              echo "=========================================="

              exit 0

            fi

            echo "Application not ready yet..."

            sleep 10

          done


          echo "ALB application test failed"

          exit 1


      # =====================================================
      # 18. FINAL OUTPUT
      # =====================================================

      - name: Deployment successful
        run: |

          echo ""
          echo "================================================"
          echo "        DEPLOYMENT SUCCESSFUL"
          echo "================================================"

          echo ""

          echo "AWS Account:"
          aws sts get-caller-identity \
            --query "Account" \
            --output text

          echo ""

          echo "AWS Role:"
          aws sts get-caller-identity \
            --query "Arn" \
            --output text

          echo ""

          echo "AWS Region:"
          echo "${AWS_REGION}"

          echo ""

          echo "Private EC2:"
          echo "${{ steps.terraform.outputs.private_ip }}"

          echo ""

          echo "SSM Instance ID:"
          echo "${{ steps.terraform.outputs.private_instance_id }}"

          echo ""

          echo "Bastion IP:"
          echo "${{ steps.terraform.outputs.bastion_ip }}"

          echo ""

          echo "ALB:"
          echo "${{ steps.terraform.outputs.alb_dns }}"

          echo ""

          echo "Application:"
          echo "${{ steps.terraform.outputs.application_url }}"

          echo ""

          echo "Architecture:"
          echo "GitHub OIDC -> AWS -> SSM -> Private EC2"

          echo "User -> ALB -> Nginx -> Gunicorn -> Flask"

          echo ""

          echo "================================================"